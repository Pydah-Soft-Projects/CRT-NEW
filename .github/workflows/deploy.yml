name: Deploy to AWS Lightsail (PM2 & Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - infra-ai

jobs:
  build-frontend:
    name: Build Frontend SPA
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --no-audit --no-fund

      - name: Build Frontend for Production
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
          VITE_SOCKET_IO_URL: /
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Deploy to Lightsail Server
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: always() && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    steps:
      - name: Checkout Code (for reference)
        uses: actions/checkout@v4

      - name: Download Frontend Artifact (if built)
        if: needs.build-frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist-to-upload

      - name: Copy Frontend Build to Server via SCP
        if: needs.build-frontend.result == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "./dist-to-upload/*"
          target: "${{ secrets.SERVER_APP_DIR || '/home/ubuntu/CRT-NEW' }}/frontend/dist"
          strip_components: 1
          overwrite: true

      - name: Execute Remote SSH Commands for PM2 & Docker
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.target || 'all' }}
          APP_DIR: ${{ secrets.SERVER_APP_DIR || '/home/ubuntu/CRT-NEW' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_TARGET,APP_DIR
          script: |
            set -e
            echo "🚀 Starting Deployment on $(hostname) for target: $DEPLOY_TARGET"
            mkdir -p "$APP_DIR/logs"
            cd "$APP_DIR"

            # 1. Update source code from Git
            echo "📥 Pulling latest Git changes..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Infrastructure / AI Server (Docker)
            if [ "$DEPLOY_TARGET" = "all" ] || [ "$DEPLOY_TARGET" = "infra-ai" ]; then
              echo "🐳 Checking Docker infrastructure (MongoDB + Speech AI)..."
              docker compose -f docker-compose.infra.yml up -d --build
            fi

            # 3. Backend (PM2)
            if [ "$DEPLOY_TARGET" = "all" ] || [ "$DEPLOY_TARGET" = "backend" ]; then
              echo "⚙️ Installing backend dependencies..."
              cd "$APP_DIR/backend"
              npm install --omit=dev --no-audit --no-fund

              cd "$APP_DIR"
              echo "🔄 Reloading Backend via PM2..."
              pm2 reload ecosystem.config.cjs --only crt-backend || pm2 start ecosystem.config.cjs --only crt-backend
            fi

            # 4. Frontend (PM2 Serve)
            if [ "$DEPLOY_TARGET" = "all" ] || [ "$DEPLOY_TARGET" = "frontend" ]; then
              cd "$APP_DIR"
              echo "🔄 Reloading Frontend via PM2..."
              pm2 reload ecosystem.config.cjs --only crt-frontend || pm2 start ecosystem.config.cjs --only crt-frontend
            fi

            # 5. Save PM2 state to persist across server reboots
            pm2 save
            echo "✅ Deployment finished successfully!"
            pm2 status

