    <!-- Centralized Theme Runtime Loader -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var themeServer = isLocal ? 'http://localhost:7000' : 'https://ui-theme.pydah.edu.in';
        var script = document.createElement('script');
        script.src = themeServer + '/themes/theme-loader.js';
        script.setAttribute('data-theme-server', themeServer);
        script.setAttribute('data-poll-interval', isLocal ? '5' : '30');
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
